[package]
name = "dsh-ops-core"
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsh-ops-worker"
path = "src/main.rs"

[dependencies]
cap-std = "3.4"
cap-fs-ext = "3.4"
serde_json = "1.0"
ops-protocol = { path = "crates/ops-protocol" }
ops-files = { path = "crates/ops-files" }
ops-documents = { path = "crates/ops-documents" }
ops-search = { path = "crates/ops-search" }
ops-results = { path = "crates/ops-results" }
ops-batch = { path = "crates/ops-batch" }

[lints.rust]
unsafe_code = "forbid"

# The worker is spawned once per tool call, so its startup dominates short
# calls. Strip debug sections and optimize across crates to keep the executable
# small; symbols stay in the binary for diagnostics. Measured on Windows x64:
# 7.41 MiB / 49 ms -> 3.52 MiB / 34 ms per spawn-to-close call.
[profile.release]
strip = "debuginfo"
lto = "fat"
codegen-units = 1

[workspace]
members = ["windows-metadata", "darwin-metadata", "crates/*"]
resolver = "3"
